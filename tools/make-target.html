<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Make target</title>
<style>body{font:14px/1.4 Consolas,monospace;background:#ecdfc6;color:#3b2a1c;padding:16px}img{max-height:60vh;border:1px solid #8c7457;background:#fff}pre{white-space:pre-wrap}</style></head>
<body>
<h3>Gion Matsuri Video · target compiler</h3>
<p>Turns <code>assets/float-image.webp</code> (the Gion Matsuri float picture) into <code>target.png</code> (flattened on white, the way it is printed) and compiles <code>targets.mind</code>. Needs <code>tools/serve.ps1</code> running: it saves both files into the project. Open with <code>?build=1</code> to run at once.</p>
<button id="go">Build target.png + targets.mind</button>
<div id="out"></div><pre id="log"></pre>
<script type="module">
const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
async function build(){
  const src = new Image(); src.src = '../assets/float-image.webp?' + Date.now(); await src.decode();
  // flatten onto white (the picture is printed on white paper); keep its own shape
  const scale = Math.min(1, 1600 / Math.max(src.naturalWidth, src.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(src.naturalWidth * scale); c.height = Math.round(src.naturalHeight * scale);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, c.width, c.height);
  const png = await new Promise((ok) => c.toBlob(ok, 'image/png'));
  let res = await fetch('/__save?name=target.png', { method: 'POST', body: png });
  log(`target.png ${c.width}×${c.height}: ${res.ok ? 'saved' : 'save failed'}`);
  const shown = new Image(); shown.src = URL.createObjectURL(png); document.getElementById('out').replaceChildren(shown);

  log('loading MindAR compiler…');
  await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js');
  const img = new Image(); img.src = '../target.png?' + Date.now(); await img.decode();
  const compiler = new window.MINDAR.IMAGE.Compiler();
  let last = -10;
  const data = await compiler.compileImageTargets([img], (p) => { if (p - last >= 10){ last = p; log(`compiling ${p.toFixed(0)}%`); } });
  const t = data[0];
  const det = t.matchingData.reduce((n, l) => n + l.maximaPoints.length + l.minimaPoints.length, 0);
  const trk = t.trackingData.reduce((n, l) => n + l.points.length, 0);
  log(`detection points: ${det} over ${t.matchingData.length} scales; tracking points: ${trk}`);
  const buf = await compiler.exportData();
  res = await fetch('/__save?name=targets.mind', { method: 'POST', body: new Blob([buf]) });
  log(`targets.mind (${(buf.byteLength / 1024).toFixed(0)} KB): ${res.ok ? 'saved' : 'save failed'}`);
  const vid = document.createElement('video'); vid.muted = true; vid.src = '../assets/gion-matsuri.mp4'; await new Promise((ok) => { vid.onloadeddata = ok; });
  vid.currentTime = 1; await new Promise((ok) => { vid.onseeked = ok; });
  const pc = document.createElement('canvas'); pc.width = vid.videoWidth; pc.height = vid.videoHeight; pc.getContext('2d').drawImage(vid, 0, 0);
  const pj = await new Promise((ok) => pc.toBlob(ok, 'image/jpeg', 0.82));
  res = await fetch('/__save?name=assets/poster.jpg', { method: 'POST', body: pj });
  log('poster.jpg: ' + (res.ok ? 'saved' : 'save failed'));
  log('DONE');
}
document.getElementById('go').onclick = () => build().catch((e) => log('ERROR ' + (e.stack || e)));
if (new URLSearchParams(location.search).has('build')) document.getElementById('go').click();
</script>
</body></html>
